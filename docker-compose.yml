version: "3.9"

services:
  mysql:
    image: mysql:8.0
    container_name: stayhub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: stayhub
      MYSQL_USER: stayhub
      MYSQL_PASSWORD: stayhubpass
    ports:
      - "3306:3306"
    volumes:
      - stayhub-mysql-data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password

  phpmyadmin:
    image: phpmyadmin:5.2
    container_name: stayhub-pma
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: rootpass
    ports:
      - "8080:80"

volumes:
  stayhub-mysql-data:
